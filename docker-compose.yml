services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: ffinn
    ports:
      - "5433:5432"   # 5433 on your machine, so it never clashes with a Postgres you already run
    volumes:
      - ffinn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ffinn"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./python-backend
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:localpass@db:5432/ffinn
      JWT_SECRET_KEY: local-dev-secret-key-change-in-production-32chars
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGJ5dGU=
      APP_URL: http://localhost:3005
      CORS_ORIGINS_RAW: http://localhost:3005
      ENVIRONMENT: development
      DEFAULT_ADMIN_EMAIL: admin@localhost
      DEFAULT_ADMIN_PASSWORD: ChangeMe123!
      MULTI_TENANCY_ENABLED: "true"
      SKIP_AUTH: "true"
    # Lets the API reach services on your machine, such as Ollama, on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./nextjs-frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8005
    ports:
      - "3005:3000"
    depends_on:
      - api

  # Execution engine: polls agent_jobs and runs the business jobs the dashboard
  # queues (lead generation, social media, …). Same image as the API, different
  # command. Scale by running more replicas — claims use SKIP LOCKED.
  agent-worker:
    build:
      context: ./python-backend
    command: ["python", "/app/agent_worker/worker.py"]
    volumes:
      - ./backend/agent_worker:/app/agent_worker:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:localpass@db:5432/ffinn
      POLL_INTERVAL: "5"
      JOB_MAX_ATTEMPTS: "3"
      WORKER_LOG_LEVEL: INFO
      SKIP_AUTH: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The image's healthcheck probes the API port, which this container does not serve.
    healthcheck:
      disable: true

volumes:
  ffinn_pgdata:
